<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c"/>
      <stop offset="100%" style="stop-color:#2d3748"/>
    </linearGradient>
    <linearGradient id="mascAnimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1"/>
      <stop offset="100%" style="stop-color:#3182ce"/>
    </linearGradient>
    <linearGradient id="mascInanimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#718096"/>
      <stop offset="100%" style="stop-color:#4a5568"/>
    </linearGradient>
    <linearGradient id="femGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ed64a6"/>
      <stop offset="100%" style="stop-color:#d53f8c"/>
    </linearGradient>
    <linearGradient id="neutGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#718096"/>
      <stop offset="100%" style="stop-color:#4a5568"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecc94b"/>
      <stop offset="100%" style="stop-color:#d69e2e"/>
    </linearGradient>
  </defs>

  <!-- Main card background -->
  <rect x="20" y="20" width="910" height="480" rx="20" fill="url(#cardBg)" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="475" y="58" text-anchor="middle" font-size="26" font-weight="bold" fill="white">Accusative Singular Cheat Sheet</text>
  <text x="475" y="82" text-anchor="middle" font-size="14" fill="#a0aec0">Koho? Co? • Direct objects, after na/pro/přes/za</text>

  <!-- Divider line -->
  <line x1="50" y1="100" x2="900" y2="100" stroke="#4a5568" stroke-width="1"/>

  <!-- Golden Rule Box -->
  <rect x="35" y="110" width="870" height="50" rx="10" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="475" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">THE GOLDEN RULE: Only Masculine Animate &amp; Feminine -a change. Everything else = NO CHANGE!</text>

  <!-- Four columns -->

  <!-- Column 1: Masculine Animate (CHANGES) -->
  <rect x="35" y="175" width="210" height="300" rx="12" fill="#1a202c" stroke="url(#mascAnimGrad)" stroke-width="3"/>
  <rect x="35" y="175" width="210" height="45" rx="12" fill="url(#mascAnimGrad)"/>
  <rect x="35" y="208" width="210" height="12" fill="url(#mascAnimGrad)"/>
  <text x="140" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="white">MASC ANIMATE</text>
  <text x="140" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#63b3ed">CHANGES!</text>

  <text x="140" y="270" text-anchor="middle" font-size="22" font-weight="bold" fill="#4299e1">-a</text>
  <text x="140" y="288" text-anchor="middle" font-size="11" fill="#a0aec0">hard stem (student, pes)</text>
  <text x="55" y="310" font-size="12" fill="#e2e8f0">student → student<tspan fill="#4299e1" font-weight="bold">a</tspan></text>
  <text x="55" y="328" font-size="12" fill="#e2e8f0">pes → ps<tspan fill="#4299e1" font-weight="bold">a</tspan></text>
  <text x="55" y="346" font-size="12" fill="#e2e8f0">bratr → bratr<tspan fill="#4299e1" font-weight="bold">a</tspan></text>

  <line x1="55" y1="360" x2="225" y2="360" stroke="#4a5568" stroke-width="1"/>

  <text x="140" y="385" text-anchor="middle" font-size="22" font-weight="bold" fill="#4299e1">-e</text>
  <text x="140" y="403" text-anchor="middle" font-size="11" fill="#a0aec0">soft stem (muž, učitel)</text>
  <text x="55" y="425" font-size="12" fill="#e2e8f0">muž → muž<tspan fill="#4299e1" font-weight="bold">e</tspan></text>
  <text x="55" y="443" font-size="12" fill="#e2e8f0">učitel → učitel<tspan fill="#4299e1" font-weight="bold">e</tspan></text>
  <text x="55" y="461" font-size="12" fill="#e2e8f0">otec → otc<tspan fill="#4299e1" font-weight="bold">e</tspan></text>

  <!-- Column 2: Masculine Inanimate (NO CHANGE) -->
  <rect x="255" y="175" width="210" height="300" rx="12" fill="#1a202c" stroke="url(#mascInanimGrad)" stroke-width="3"/>
  <rect x="255" y="175" width="210" height="45" rx="12" fill="url(#mascInanimGrad)"/>
  <rect x="255" y="208" width="210" height="12" fill="url(#mascInanimGrad)"/>
  <text x="360" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="white">MASC INANIMATE</text>
  <text x="360" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#a0aec0">NO CHANGE</text>

  <text x="360" y="280" text-anchor="middle" font-size="28" font-weight="bold" fill="#718096">=</text>
  <text x="360" y="310" text-anchor="middle" font-size="12" fill="#a0aec0">Same as nominative!</text>

  <text x="275" y="345" font-size="12" fill="#e2e8f0">stůl → <tspan fill="#718096" font-weight="bold">stůl</tspan></text>
  <text x="275" y="365" font-size="12" fill="#e2e8f0">dům → <tspan fill="#718096" font-weight="bold">dům</tspan></text>
  <text x="275" y="385" font-size="12" fill="#e2e8f0">počítač → <tspan fill="#718096" font-weight="bold">počítač</tspan></text>
  <text x="275" y="405" font-size="12" fill="#e2e8f0">telefon → <tspan fill="#718096" font-weight="bold">telefon</tspan></text>

  <rect x="270" y="425" width="180" height="40" rx="8" fill="#2d3748"/>
  <text x="360" y="445" text-anchor="middle" font-size="10" fill="#a0aec0">Tables, houses, things</text>
  <text x="360" y="458" text-anchor="middle" font-size="10" fill="#a0aec0">don't change!</text>

  <!-- Column 3: Feminine -->
  <rect x="475" y="175" width="210" height="300" rx="12" fill="#1a202c" stroke="url(#femGrad)" stroke-width="3"/>
  <rect x="475" y="175" width="210" height="45" rx="12" fill="url(#femGrad)"/>
  <rect x="475" y="208" width="210" height="12" fill="url(#femGrad)"/>
  <text x="580" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="white">FEMININE</text>

  <text x="580" y="245" text-anchor="middle" font-size="22" font-weight="bold" fill="#ed64a6">-a → -u</text>
  <text x="580" y="263" text-anchor="middle" font-size="11" fill="#f687b3">CHANGES!</text>
  <text x="495" y="285" font-size="12" fill="#e2e8f0">žena → žen<tspan fill="#ed64a6" font-weight="bold">u</tspan></text>
  <text x="495" y="303" font-size="12" fill="#e2e8f0">kniha → knih<tspan fill="#ed64a6" font-weight="bold">u</tspan></text>
  <text x="495" y="321" font-size="12" fill="#e2e8f0">Praha → Prah<tspan fill="#ed64a6" font-weight="bold">u</tspan></text>

  <line x1="495" y1="335" x2="665" y2="335" stroke="#4a5568" stroke-width="1"/>

  <text x="580" y="360" text-anchor="middle" font-size="22" font-weight="bold" fill="#ed64a6">-e → -i</text>
  <text x="580" y="378" text-anchor="middle" font-size="11" fill="#f687b3">CHANGES!</text>
  <text x="495" y="400" font-size="12" fill="#e2e8f0">růže → růž<tspan fill="#ed64a6" font-weight="bold">i</tspan></text>
  <text x="495" y="418" font-size="12" fill="#e2e8f0">restaurace → restaurac<tspan fill="#ed64a6" font-weight="bold">i</tspan></text>

  <line x1="495" y1="432" x2="665" y2="432" stroke="#4a5568" stroke-width="1"/>

  <text x="580" y="455" text-anchor="middle" font-size="14" fill="#a0aec0">-cons → no change</text>
  <text x="580" y="470" text-anchor="middle" font-size="11" fill="#718096">(věc, noc stay same)</text>

  <!-- Column 4: Neuter (NO CHANGE) -->
  <rect x="695" y="175" width="210" height="300" rx="12" fill="#1a202c" stroke="url(#neutGrad)" stroke-width="3"/>
  <rect x="695" y="175" width="210" height="45" rx="12" fill="url(#neutGrad)"/>
  <rect x="695" y="208" width="210" height="12" fill="url(#neutGrad)"/>
  <text x="800" y="205" text-anchor="middle" font-size="14" font-weight="bold" fill="white">NEUTER</text>
  <text x="800" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#a0aec0">NO CHANGE</text>

  <text x="800" y="280" text-anchor="middle" font-size="28" font-weight="bold" fill="#718096">=</text>
  <text x="800" y="310" text-anchor="middle" font-size="12" fill="#a0aec0">Same as nominative!</text>

  <text x="715" y="345" font-size="12" fill="#e2e8f0">město → <tspan fill="#718096" font-weight="bold">město</tspan></text>
  <text x="715" y="365" font-size="12" fill="#e2e8f0">auto → <tspan fill="#718096" font-weight="bold">auto</tspan></text>
  <text x="715" y="385" font-size="12" fill="#e2e8f0">pivo → <tspan fill="#718096" font-weight="bold">pivo</tspan></text>
  <text x="715" y="405" font-size="12" fill="#e2e8f0">moře → <tspan fill="#718096" font-weight="bold">moře</tspan></text>
  <text x="715" y="425" font-size="12" fill="#e2e8f0">nádraží → <tspan fill="#718096" font-weight="bold">nádraží</tspan></text>

  <rect x="710" y="445" width="180" height="25" rx="8" fill="#2d3748"/>
  <text x="800" y="462" text-anchor="middle" font-size="10" fill="#a0aec0">All neuter = no change!</text>
</svg>
