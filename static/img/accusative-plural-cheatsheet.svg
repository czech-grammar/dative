<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c"/>
      <stop offset="100%" style="stop-color:#2d3748"/>
    </linearGradient>
    <linearGradient id="mascAnimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1"/>
      <stop offset="100%" style="stop-color:#3182ce"/>
    </linearGradient>
    <linearGradient id="noChangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#718096"/>
      <stop offset="100%" style="stop-color:#4a5568"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecc94b"/>
      <stop offset="100%" style="stop-color:#d69e2e"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#48bb78"/>
      <stop offset="100%" style="stop-color:#38a169"/>
    </linearGradient>
  </defs>

  <!-- Main card background -->
  <rect x="20" y="20" width="910" height="440" rx="20" fill="url(#cardBg)" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="475" y="58" text-anchor="middle" font-size="26" font-weight="bold" fill="white">Accusative Plural Cheat Sheet</text>
  <text x="475" y="82" text-anchor="middle" font-size="14" fill="#a0aec0">Koho? Co? • Plural direct objects</text>

  <!-- Divider line -->
  <line x1="50" y1="100" x2="900" y2="100" stroke="#4a5568" stroke-width="1"/>

  <!-- Golden Rule Box -->
  <rect x="35" y="110" width="870" height="50" rx="10" fill="url(#goldGrad)" filter="url(#shadow)"/>
  <text x="475" y="142" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">THE SIMPLE RULE: Only Masculine Animate changes. Everything else = Same as Nominative Plural!</text>

  <!-- Two main sections -->

  <!-- Left: Masculine Animate (CHANGES) -->
  <rect x="35" y="175" width="420" height="270" rx="12" fill="#1a202c" stroke="url(#mascAnimGrad)" stroke-width="3"/>
  <rect x="35" y="175" width="420" height="50" rx="12" fill="url(#mascAnimGrad)"/>
  <rect x="35" y="213" width="420" height="12" fill="url(#mascAnimGrad)"/>
  <text x="245" y="208" text-anchor="middle" font-size="18" font-weight="bold" fill="white">MASCULINE ANIMATE</text>
  <text x="245" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#63b3ed">CHANGES: Nom. Pl. ≠ Acc. Pl.</text>

  <!-- Hard pattern -->
  <rect x="50" y="270" width="185" height="160" rx="8" fill="#2d3748"/>
  <text x="142" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#4299e1">Hard → -y</text>
  <text x="142" y="315" text-anchor="middle" font-size="11" fill="#a0aec0">Nom: -i → Acc: -y</text>

  <text x="65" y="345" font-size="12" fill="#e2e8f0">student<tspan fill="#a0aec0">i</tspan> → student<tspan fill="#4299e1" font-weight="bold">y</tspan></text>
  <text x="65" y="365" font-size="12" fill="#e2e8f0">ps<tspan fill="#a0aec0">i</tspan> → ps<tspan fill="#4299e1" font-weight="bold">y</tspan></text>
  <text x="65" y="385" font-size="12" fill="#e2e8f0">bratř<tspan fill="#a0aec0">i</tspan> → bratr<tspan fill="#4299e1" font-weight="bold">y</tspan></text>
  <text x="65" y="405" font-size="12" fill="#e2e8f0">pán<tspan fill="#a0aec0">i</tspan> → pán<tspan fill="#4299e1" font-weight="bold">y</tspan></text>

  <!-- Soft pattern -->
  <rect x="250" y="270" width="185" height="160" rx="8" fill="#2d3748"/>
  <text x="342" y="295" text-anchor="middle" font-size="14" font-weight="bold" fill="#4299e1">Soft → -e</text>
  <text x="342" y="315" text-anchor="middle" font-size="11" fill="#a0aec0">Nom: -i/-é → Acc: -e</text>

  <text x="265" y="345" font-size="12" fill="#e2e8f0">muž<tspan fill="#a0aec0">i</tspan> → muž<tspan fill="#4299e1" font-weight="bold">e</tspan></text>
  <text x="265" y="365" font-size="12" fill="#e2e8f0">učitel<tspan fill="#a0aec0">é</tspan> → učitel<tspan fill="#4299e1" font-weight="bold">e</tspan></text>
  <text x="265" y="385" font-size="12" fill="#e2e8f0">přítel<tspan fill="#a0aec0">é</tspan> → přítel<tspan fill="#4299e1" font-weight="bold">e</tspan></text>
  <text x="265" y="405" font-size="12" fill="#e2e8f0">lékaři → lékař<tspan fill="#4299e1" font-weight="bold">e</tspan></text>

  <!-- Right: Everything Else (NO CHANGE) -->
  <rect x="475" y="175" width="430" height="270" rx="12" fill="#1a202c" stroke="url(#greenGrad)" stroke-width="3"/>
  <rect x="475" y="175" width="430" height="50" rx="12" fill="url(#greenGrad)"/>
  <rect x="475" y="213" width="430" height="12" fill="url(#greenGrad)"/>
  <text x="690" y="208" text-anchor="middle" font-size="18" font-weight="bold" fill="white">EVERYTHING ELSE</text>
  <text x="690" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#68d391">NO CHANGE: Acc. Pl. = Nom. Pl.</text>

  <!-- Three sub-boxes -->
  <!-- Masc Inanimate -->
  <rect x="490" y="270" width="130" height="160" rx="8" fill="#2d3748"/>
  <text x="555" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#48bb78">Masc Inanim</text>
  <text x="505" y="325" font-size="11" fill="#e2e8f0">stoly → stoly</text>
  <text x="505" y="345" font-size="11" fill="#e2e8f0">domy → domy</text>
  <text x="505" y="365" font-size="11" fill="#e2e8f0">hrady → hrady</text>
  <text x="555" y="400" text-anchor="middle" font-size="28" fill="#48bb78">=</text>

  <!-- Feminine -->
  <rect x="630" y="270" width="130" height="160" rx="8" fill="#2d3748"/>
  <text x="695" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#48bb78">Feminine</text>
  <text x="645" y="325" font-size="11" fill="#e2e8f0">ženy → ženy</text>
  <text x="645" y="345" font-size="11" fill="#e2e8f0">knihy → knihy</text>
  <text x="645" y="365" font-size="11" fill="#e2e8f0">růže → růže</text>
  <text x="695" y="400" text-anchor="middle" font-size="28" fill="#48bb78">=</text>

  <!-- Neuter -->
  <rect x="770" y="270" width="120" height="160" rx="8" fill="#2d3748"/>
  <text x="830" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#48bb78">Neuter</text>
  <text x="785" y="325" font-size="11" fill="#e2e8f0">města → města</text>
  <text x="785" y="345" font-size="11" fill="#e2e8f0">auta → auta</text>
  <text x="785" y="365" font-size="11" fill="#e2e8f0">moře → moře</text>
  <text x="830" y="400" text-anchor="middle" font-size="28" fill="#48bb78">=</text>
</svg>
